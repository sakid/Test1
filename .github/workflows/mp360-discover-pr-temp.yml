name: Temporary Cyan PDX tour-data HTTP probe

on:
  pull_request:
    branches: [master]
    paths:
      - mp360-jina-relay.md
      - mp360-http-probe.py
      - .github/workflows/mp360-discover-pr-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary discovery branch
        uses: actions/checkout@v4
        with:
          ref: mp360-cyan-id-discovery-20260807

      - name: Probe server HTML and listing bundles
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests curl_cffi
          rm -rf discovery/http-probe
          python mp360-http-probe.py 2>&1 | tee discovery/http-probe-run.log
          cat discovery/http-probe/summary.json

      - name: Commit HTTP-probe evidence to temporary branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f discovery/http-probe discovery/http-probe-run.log || true
          if git diff --cached --quiet; then
            echo "No HTTP probe files to commit."
          else
            git commit -m "Save Cyan tour-data HTTP probe"
            git push origin HEAD:mp360-cyan-id-discovery-20260807
          fi

      - name: Upload HTTP-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyan-pdx-tour-data-http-probe-${{ github.run_id }}
          path: |
            discovery/http-probe/**
            discovery/http-probe-run.log
          if-no-files-found: warn
          retention-days: 1
