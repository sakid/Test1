name: MP360 Cyan C1 rate-limited panorama retry

on:
  pull_request:
    branches: [master]
    paths:
      - mp360-jina-relay.md
      - mp360/**
      - .github/workflows/mp360-discover-pr-temp.yml

permissions:
  contents: read

jobs:
  extract-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: mp360-cyan-encrypted-20260807

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip jq
          python -m pip install --upgrade pip
          python -m pip install pillow requests curl_cffi aiofiles tqdm
          python -m py_compile mp360/convert_cyan_tours.py
          ffmpeg -hide_banner -filters | grep -E '(^| )v360( |$)'

      - name: Download and convert C1 at low concurrency
        shell: bash
        run: bash mp360/run_c1_retry.sh

      - name: Upload C1 panorama ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyan-pdx-c1-panoramas-${{ github.run_id }}
          path: |
            output/cyan-pdx-remaining-matterport-panoramas.zip
            output/manifest.json
            output/RUN_SUMMARY.md
            output/BUNDLE_SHA256.txt
            output/contact_sheets/**
            output/discovery/**
            output/logs/**
            output/model-download-status.tsv
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1

      - name: Require complete C1 model
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('output/manifest.json').read_text())
          if manifest['remainingModelCount'] != 1:
              raise SystemExit(
                  f"Expected one C1 model; got {manifest['remainingModelCount']}"
              )
          if manifest['remainingPanoramaCount'] < 23:
              raise SystemExit(
                  f"Expected 23 C1 panoramas; got {manifest['remainingPanoramaCount']}"
              )
          PY
